name: Build and deploy the site

# The page templates, stylesheets and build scripts live in pages/ here, as does
# the blog. The book they render -- the LaTeX, the Sage implementations and the
# generated listing data -- lives in AppliedPQC/AppliedPQC, which is public and
# so is checked out without a token; nothing here needs a secret. Blog posts
# listed in blog/sources.json come from other AppliedPQC repositories and are
# fetched at build time rather than copied in.
#
# GitHub cannot notify this repository when any of that changes, so a schedule
# polls. The poll is cheap: it compares a key covering every repository the
# build reads against the one recorded in the live site, and stops before
# installing anything if they match.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'      # hourly, offset off the hour
  # A manual run always rebuilds: the source check below applies only to the
  # scheduled poll, so asking for a build by hand always gets one.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_REPO: AppliedPQC/AppliedPQC
  PANDOC_VERSION: '3.1.3'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Check out the site repository
        uses: actions/checkout@v4

      - name: Check out the book source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: source

      - name: Decide whether a rebuild is needed
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          # The book is not the only thing the site renders: posts listed in
          # blog/sources.json are pulled from other AppliedPQC repositories at
          # build time. Keying this check on the book alone left edits to those
          # posts permanently unpublished, so the key covers every repository
          # the build reads.
          key="$(python3 pages/content_key.py "$sha" blog/sources.json)"
          echo "content_key=$key" >> "$GITHUB_OUTPUT"
          live="$(curl -sf --max-time 20 https://appliedpqc.io/build-info.json \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("content_key",""))' \
                  2>/dev/null || true)"
          echo "live key is ${live:-<none>}, computed key is $key (book $sha)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$key" = "$live" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the site reads has changed; skipping before any install."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TeX Live
        if: steps.decide.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-science

      - name: Install pandoc
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          url="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 5 -o /tmp/pandoc.tar.gz "$url"
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/pandoc-${PANDOC_VERSION}/bin/pandoc" /usr/local/bin/pandoc
          pandoc --version | head -1 | grep -qw "${PANDOC_VERSION}" || {
            echo "::error::expected pandoc ${PANDOC_VERSION}"
            exit 1
          }

      - name: Build the book
        if: steps.decide.outputs.build == 'true'
        working-directory: source
        run: |
          set -euo pipefail
          make
          # The listing data is generated from chapters/*.tex; fail rather than
          # publish a playground that disagrees with the book.
          python3 sage/playground/extract_listings.py --check

      - name: Build the site
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "jinja2==3.1.*"
          python3 pages/build_site.py --source source site

      - name: Record what was built
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          printf '{\n "source_repo": "%s",\n "source_sha": "%s",\n "content_key": "%s",\n "built_by": "%s",\n "run": "%s"\n}\n' \
            "$SOURCE_REPO" "${{ steps.decide.outputs.source_sha }}" \
            "${{ steps.decide.outputs.content_key }}" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > site/build-info.json
          cat site/build-info.json

      - name: Check the rendered site
        if: steps.decide.outputs.build == 'true'
        run: python3 pages/check_site.py --source source site

      - name: Upload Pages artifact
        if: steps.decide.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
