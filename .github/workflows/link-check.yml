name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'   # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every link on the landing page
        run: |
          set -uo pipefail
          # Relative hrefs are resolved against the live site so that the
          # cross-repo links (the book, its PDF) are checked for real.
          base="https://appliedpqc.io/"
          # -h matters: with several files, grep -o prefixes every match
          # with "filename:", which silently corrupts every URL.
          grep -hoE 'href="[^"]+"' index.html README.md 404.html \
            | sed 's/^href="//; s/"$//' | sort -u > raw.txt
          : > urls.txt
          while read -r h; do
            case "$h" in
              http*) echo "$h" >> urls.txt ;;
              /*)    echo "${base}${h#/}" >> urls.txt ;;
              *)     echo "${base}${h}" >> urls.txt ;;
            esac
          done < raw.txt
          echo "checking $(wc -l < urls.txt) URLs"
          fail=0
          while read -r u; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 \
                        --max-redirs 5 -A 'Mozilla/5.0 (link-check)' "$u")
            case "$code" in
              200|206) ;;
              *) echo "::error::$code $u"; fail=$((fail+1)) ;;
            esac
          done < urls.txt
          if [ "$fail" -gt 0 ]; then echo "$fail bad link(s)"; exit 1; fi
          echo "all links OK"
