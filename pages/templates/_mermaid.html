<!-- Diagrams. pandoc turns a fenced mermaid block into a pre element carrying
     the class mermaid looks for, so one source renders both here and on GitHub
     with no second copy to keep in step. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  // pandoc emits <pre class="mermaid"><code>...</code></pre>, and mermaid reads
  // innerHTML rather than textContent, so the inner <code> tag arrives as part
  // of the diagram source and every graph fails to parse. Lift the text out of
  // the wrapper first. Without it every diagram renders as the error graphic.
  for (const code of document.querySelectorAll("pre.mermaid > code")) {
    code.parentElement.textContent = code.textContent;
  }
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({
    // Run explicitly: this module is fetched from a CDN and can execute after
    // the load event that startOnLoad waits for.
    startOnLoad: false,
    theme: dark ? "dark" : "neutral",
    securityLevel: "strict",
    // useMaxWidth would set the svg to width:100% with the natural size as
    // a max, so a diagram wider than the column is scaled down to fit and
    // its labels shrink with it. Draw at natural size instead and let the
    // pre scroll, which is what overflow-x above is for.
    flowchart: { curve: "basis", useMaxWidth: false },
    themeVariables: { fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" }
  });
  await mermaid.run();
</script>
<style>
  pre.mermaid {
    background: none;
    border: 0;
    padding: 0;
    text-align: center;
    overflow-x: auto;
  }
  pre.mermaid > code { background: none; padding: 0; font-size: inherit; }
</style>
